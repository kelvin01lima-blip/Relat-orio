    <title>Relatório de Performance - S.O.S Soluções</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --sos-orange: #f38b68;
            --sos-orange-glow: rgba(243, 139, 104, 0.25);
            --sos-blue: #395c6b;
            --sos-blue-light: #4d7c91;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 40%, #fff7ed 100%);
            min-height: 100vh;
            color: #0f172a;
        }

        /* Card Futurista Claro com Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 25px -5px rgba(57, 92, 107, 0.08), 0 8px 16px -6px rgba(243, 139, 104, 0.08);
            border-radius: 16px;
        }

        .border-glow-orange {
            border-top: 4px solid var(--sos-orange);
        }

        .border-glow-blue {
            border-top: 4px solid var(--sos-blue);
        }

        .header-gradient {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 4px solid var(--sos-orange);
        }

        .badge-orange {
            background: linear-gradient(135deg, #f38b68 0%, #e07048 100%);
            box-shadow: 0 4px 12px rgba(243, 139, 104, 0.35);
        }
    </style>
</head>
